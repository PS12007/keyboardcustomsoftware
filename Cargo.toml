[package]
name = "keyboardcustomsoftware"
version = "0.2.0"
edition = "2021"
description = "Lightweight custom RGB lighting for the Surmen V400 keyboard"
license = "MIT"

[[bin]]
name = "KeyboardCustomSoftware"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
tray-icon = "0.26"
cpal = "0.18"
realfft = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.56"
windows = { version = "0.62", features = [
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Diagnostics_ToolHelp",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
embed-resource = "3"
